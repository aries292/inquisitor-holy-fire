const audio=(()=>{
 let ctx=null,master=null,musicBus=null,effectsBus=null,nextNote=0,noteIndex=0;
 const defaults={music:true,effects:true,volume:65};let cfg={...defaults};
 try{const old=JSON.parse(localStorage.getItem('holyFireAudioV62')||'null');if(old&&typeof old==='object'){cfg.music=old.music!==false;cfg.effects=old.effects!==false;cfg.volume=Number.isFinite(+old.volume)?Math.min(100,Math.max(0,+old.volume)):65}}catch{}
 const musicInput=document.getElementById('musicEnabled'),fxInput=document.getElementById('effectsEnabled'),volInput=document.getElementById('audioVolume'),volText=document.getElementById('volumeText');
 function gainSet(){if(!ctx)return;master.gain.setTargetAtTime(cfg.volume/100*.48,ctx.currentTime,.025);musicBus.gain.setTargetAtTime(cfg.music?.29:0,ctx.currentTime,.025);effectsBus.gain.setTargetAtTime(cfg.effects?.62:0,ctx.currentTime,.025)}
 function persist(){try{localStorage.setItem('holyFireAudioV62',JSON.stringify(cfg))}catch{}gainSet();volText.textContent=cfg.volume+'%'}
 musicInput.checked=cfg.music;fxInput.checked=cfg.effects;volInput.value=String(cfg.volume);volText.textContent=cfg.volume+'%';
 musicInput.addEventListener('change',()=>{cfg.music=musicInput.checked;nextNote=0;persist();unlock()});
 fxInput.addEventListener('change',()=>{cfg.effects=fxInput.checked;persist();unlock();if(cfg.effects)sound('bonus')});
 volInput.addEventListener('input',()=>{cfg.volume=Number(volInput.value);persist()});
 function unlock(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();musicBus=ctx.createGain();effectsBus=ctx.createGain();musicBus.connect(master);effectsBus.connect(master);master.connect(ctx.destination);gainSet()}if(ctx.state==='suspended')ctx.resume().catch(()=>{})}catch{}}
 function tone(freq,at,duration,vol=.14,type='square',bus=effectsBus,bend=1){if(!ctx||!bus||!freq)return;const osc=ctx.createOscillator(),amp=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(Math.max(30,freq),at);if(bend!==1)osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq*bend),at+duration);amp.gain.setValueAtTime(.0001,at);amp.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),at+.012);amp.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.connect(amp);amp.connect(bus);osc.start(at);osc.stop(at+duration+.012)}
 function sound(name){if(!cfg.effects||!ctx||ctx.state!=='running')return;const t=ctx.currentTime+.004;switch(name){
 case 'holy':[196,246.94,293.66,392,493.88].forEach((f,i)=>tone(f,t+i*.065,1.05-i*.08,.105,'sawtooth',effectsBus,.7));break;
 case 'fire':tone(420,t,.15,.15,'sawtooth',effectsBus,.42);tone(750,t,.09,.07,'triangle',effectsBus,.5);break;
 case 'jump':tone(260,t,.12,.095,'square',effectsBus,1.7);break;
 case 'impact':tone(175,t,.14,.16,'sawtooth',effectsBus,.4);break;
 case 'kill':tone(520,t,.09,.1,'square');tone(780,t+.08,.11,.08,'triangle');break;
 case 'bonus':tone(523,t,.13,.11,'triangle');tone(659,t+.11,.14,.1,'triangle');tone(880,t+.23,.21,.11,'square');break;
 case 'combo':tone(740,t,.07,.065,'triangle');tone(988,t+.08,.1,.08,'triangle');break;

 rect(595,48,106,5,'#211a2b');rect(595,48,106*Math.max(0,Math.min(1,elapsedInStage/38)),5,'#d8a46b');
 g.restore();
}
function encounterFeedback(){
 if(mode!=='play')return;
 // Una piccola vignettatura al danno, senza alterare la tela di collisioni.
 if(hurt>0){g.save();g.globalAlpha=Math.min(.15,hurt*.18);rect(0,0,10,H,'#ff6055');rect(W-10,0,10,H,'#ff6055');g.restore()}
}
function render(){if(!spriteReady){bg();text(loadError?'ASSET MANCANTI':'CARICAMENTO SPRITE...',W/2,H/2,25,'#ffe3a1','center');return}g.save(); if(shake>0)g.translate(R(-shake,shake),R(-shake*.45,shake*.45)); bg(); heroDraw();if(power.shield>0){g.strokeStyle='#80dcf6';g.lineWidth=4;g.beginPath();g.ellipse(hero.x+34,hero.y+50,43,56,0,0,Math.PI*2);g.stroke()} for(const h of hazards)booksDraw(h); bossDraw();waveDraw(); for(const b of bonuses)bonusDraw(b);for(const m of mobs)enemyDraw(m);enemyProjectileDraw(); combatTelegraphs(); for(const s of shots)fireDraw(s); visualHighlights(); for(const p of dust) rect(p.x,p.y,p.size,p.size,'#cf9d7c'); for(const p of fx) rect(p.x,p.y,p.s,p.s,p.color); g.restore(); if(hurt>0) rect(0,0,W,H,`rgba(255,95,73,${hurt*.12})`); hud();stageHud();encounterFeedback() }
function tick(t){audio.tick(mode);const dt=Math.min((t-last)/1000||0,.035); last=t;if(mode==='victoryAnimation'){victoryTime+=dt;shake=Math.max(0,shake-dt*14);if(victoryTime>=2.35)showVictoryResults();}else update(dt);render();if(mode==='victoryAnimation'){g.save();g.globalAlpha=.22+.32*Math.abs(Math.sin(victoryTime*7));g.fillStyle='#ffd17e';g.fillRect(0,0,W,H);g.restore();text('✠ VICTORIA ✠',W/2,215,54,'#fff0b4','center');}requestAnimationFrame(tick)}
function pause(){if(mode==='play'){mode='pause';audio.sound('pause')}else if(mode==='pause'){mode='play';audio.unlock();audio.sound('pause')}}
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW','KeyF','KeyP','KeyR','KeyE'].includes(e.code))e.preventDefault(); if(e.repeat&&['Space','KeyP','KeyR','KeyE'].includes(e.code))return; if(e.code==='KeyP')pause(); else if(e.code==='KeyR')reset(); else if(e.code==='KeyE')holyFire(); else if(['ArrowUp','KeyW'].includes(e.code))jump(); else if(['Space','KeyF'].includes(e.code))fire()});
// Touch Safari: preferisce Pointer Events quando disponibili; sui browser più vecchi usa Touch Events.
function press(el,action){
 let lastTouch=0;
 if(window.PointerEvent){el.addEventListener('pointerdown',e=>{e.preventDefault();action()},{passive:false});}
 else {el.addEventListener('touchstart',e=>{e.preventDefault();lastTouch=Date.now();action()},{passive:false});
 el.addEventListener('mousedown',e=>{if(Date.now()-lastTouch<750)return;e.preventDefault();action()});}
}
press(C,fire);
press(document.getElementById('fire'),fire);
press(document.getElementById('jump'),jump);
press(document.getElementById('holy'),holyFire);
document.getElementById('pause').addEventListener('click',e=>{e.preventDefault();pause()});
document.querySelectorAll('.difficulty-option').forEach(button=>button.addEventListener('click',()=>{if(mode==='play'||mode==='pause')return;difficultyName=button.dataset.level;difficulty=DIFFICULTIES[difficultyName];document.querySelectorAll('.difficulty-option').forEach(b=>{const active=b===button;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});const desc={easy:'Ritmo e densità originali',medium:'Nemici più frequenti e veloci · punti ×1,5',hard:'Più avversari, ritmo intenso e attacchi ravvicinati · punti ×2'};document.getElementById('difficulty-description').textContent=desc[difficultyName];try{best=+(localStorage.getItem(bestKey())||0)}catch{best=0}}));
start.addEventListener('click',e=>{e.preventDefault();reset()});
// Interrompe la partita quando si cambia applicazione: evita perdite di vite al ritorno.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')mode='pause'});
requestAnimationFrame(tick);
})();
